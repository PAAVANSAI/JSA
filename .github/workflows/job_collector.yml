name: JSA Smart Radar (24/7 Automated Job Hunter)

on:
  schedule:
    # Runs automatically every 15 minutes 24/7 in GitHub Actions cloud
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions button

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Job Collector
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LAYER1_ENABLED: 'true'
          LAYER2_ENABLED: 'true'
          JOBSPY_ENABLE_NAUKRI: 'true'
          MIN_MATCH_SCORE: '60.0'
          MAX_JOB_AGE_HOURS: '24'
        run: |
          python main.py --sweep-all

      - name: Commit Updated Seen Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jsa_jobs.db applications_tracker.csv
          git diff --staged --quiet || (git commit -m "chore: update state and tracker [skip ci]" && git pull --rebase && git push)
