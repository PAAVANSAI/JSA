name: JSA 24-7 Job Collector (5-Minute Radar)

on:
  schedule:
    # Runs every 5 minutes 24/7 in the cloud
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Job Collector
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LAYER1_ENABLED: 'true'
          LAYER2_ENABLED: 'true'
          JOBSPY_ENABLE_NAUKRI: 'true'
          MIN_MATCH_SCORE: '60.0'
        run: |
          python main.py --keywords "AWS" "DevOps" --locations "Hyderabad" "Bengaluru" "Remote"

      - name: Commit Updated Seen Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jsa_jobs.db
          git diff --staged --quiet || git commit -m "chore: update deduplication state [skip ci]"
          git push
