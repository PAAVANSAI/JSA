name: JSA Smart Radar (Day 5-Min / Night 8-Hr)

on:
  schedule:
    # Daytime (6:00 AM – 10:00 PM IST = 00:30 to 16:30 UTC): Every 5 minutes
    - cron: '30,35,40,45,50,55 0 * * *'
    - cron: '*/5 1-16 * * *'
    # Nighttime (Runs once at night: 2:30 AM IST = 21:00 UTC)
    - cron: '0 21 * * *'
  workflow_dispatch: # Allows manual run anytime from GitHub button

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Job Collector
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LAYER1_ENABLED: 'true'
          LAYER2_ENABLED: 'true'
          JOBSPY_ENABLE_NAUKRI: 'true'
          MIN_MATCH_SCORE: '60.0'
          MAX_JOB_AGE_HOURS: '24'
        run: |
          python main.py --keywords "AWS" "DevOps" --locations "Hyderabad" "Bengaluru" "Remote"

      - name: Commit Updated Seen Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jsa_jobs.db applications_tracker.csv
          git diff --staged --quiet || (git commit -m "chore: update state and tracker [skip ci]" && git pull --rebase && git push)
